# Projet Xcode de l'app Dressing (généré par XcodeGen sur GitHub).
name: Dressing
options:
  bundleIdPrefix: com.tepsko
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: fr

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_VERSION: "5.0"

targets:
  Dressing:
    type: application
    platform: iOS
    sources:
      - path: Dressing
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Dressing
        CFBundleDevelopmentRegion: fr
        CFBundleLocalizations: [fr]
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "Dressing utilise l’appareil photo pour photographier tes habits."
        NSPhotoLibraryUsageDescription: "Dressing ouvre tes photos pour ajouter un habit."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tepsko.dressing
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
